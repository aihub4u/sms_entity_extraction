services:
  - type: web
    name: sbi-txn-complaint-api
    runtime: node
    region: singapore
    plan: starter
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: API_KEY
        generateValue: true
      - key: OPENAI_MODEL
        value: gpt-5.4-mini
      - key: OPENAI_REASONING_EFFORT
        value: low
      - key: TZ_NAME
        value: Asia/Kolkata
      - key: SBI_COMPLAINT_API_URL
        sync: false
